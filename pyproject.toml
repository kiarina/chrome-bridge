[project]
name = "chrome-bridge-workspace"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = ["chrome-bridge-mcp", "chrome-bridge-sdk"]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "packaging>=24,<27",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.uv.sources]
chrome-bridge-mcp = { workspace = true }
chrome-bridge-sdk = { workspace = true }

[tool.uv.workspace]
members = ["packages/mcp", "packages/sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["packages/mcp/tests", "scripts/tests"]

[tool.ruff]
# The workspace root is the project root for Ruff, so the src-layout packages must be
# listed explicitly; otherwise isort (I001) classifies chrome_bridge_mcp/_sdk as third-party.
src = [".", "packages/mcp/src", "packages/sdk/src"]

[tool.ruff.lint]
# TRY004 would turn ValueError into TypeError after isinstance validation. The Direct
# API maps ValueError to 400 invalid_argument and anything else to 500 internal_error
# (docs/concepts/api.md), and the release scripts treat malformed JSON as bad values.
ignore = ["TRY004"]

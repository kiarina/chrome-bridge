[project]
name = "chrome-bridge-mcp"
version = "0.4.0"
description = "HTTP MCP server that bridges LLM agents to a Chrome extension"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    # Upper bound with evidence; see "Dependency version bounds" in AGENTS.md.
    # mcp 2.x removed mcp.server.fastmcp, and 2.1.0 replaces tool-handler exception
    # text with a generic message, which is the public error contract in
    # docs/concepts/api.md. Tracked by tasks/mcp-sdk-v2-migration.md.
    "mcp[cli]>=1.27,<2",
    "uvicorn>=0.35",
    "websockets>=15",
]

[project.urls]
Changelog = "https://github.com/kiarina/chrome-bridge/blob/main/packages/mcp/CHANGELOG.md"

[project.scripts]
chrome-bridge-mcp = "chrome_bridge_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/chrome_bridge_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests"]

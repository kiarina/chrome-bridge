[project]
name = "chrome-bridge-sdk"
version = "0.4.0"
description = "Python SDK for the shared Chrome Bridge service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # Upper bound with evidence; see "Dependency version bounds" in AGENTS.md.
    # The SDK and the server are released together from this repository and
    # scripts/validate_static.py requires their versions to be identical.
    "chrome-bridge-mcp>=0.4,<0.5",
    "httpx2>=2",
]

[project.urls]
Changelog = "https://github.com/kiarina/chrome-bridge/blob/main/packages/sdk/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/chrome_bridge_sdk"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests"]
